name: MSBuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v3

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}
      
    - name: Declare variables
      shell: bash
      run: |
        export sha_short=$(git rev-parse --short "$GITHUB_SHA")
        sed -i "s/#TESTTAG#/${sha_short}/g" client/Main.xaml.cs
        
    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /property:Platform=x86 ${{env.SOLUTION_FILE_PATH}}

    - uses: actions/upload-artifact@v7
      id: upload-unsigned-artifact
      with:
       path: client\bin\Release\client.exe
       archive: false

    - name: submit signing request
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '566891e5-0205-4eae-a687-ca2e0db3c124'
        project-slug: 'tso_client'
        signing-policy-slug: 'test-signing'
        github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: 'client\bin\Release'
