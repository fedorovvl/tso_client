name: APKBuild

on:
  push:
    paths:
    - 'android/**'
    - '.github/workflows/apkbuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup JDK
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Download SWF
      run: curl --fail --location --retry 3 --output android/assets/client.swf https://github.com/fedorovvl/tso_client_swf/releases/download/latest/client.swf
    - name: Build APK
      working-directory: android
      run: java -jar -Duser.language=en -Dfile.encoding=UTF8 apktool.jar b .
    - name: Sign app APK
      working-directory: android
      run: jarsigner -verbose -keystore sign.keystore -storepass qwerty dist/client.apk abc.keystore
    - uses: actions/upload-artifact@v4
      with:
       name: client
       path: android/dist/client.apk
